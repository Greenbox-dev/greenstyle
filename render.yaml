services:
  - type: web
    name: meu-financeiro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_PATH
        value: /var/data/financeiro.db
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: finance-data
      mountPath: /var/data
      sizeGB: 1
